name: 'Setup Azure and Terraform'
description: 'Setup Azure CLI, Terraform, and login to Azure with OIDC'
author: 'wpbastos-com'

branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  # Terraform configuration
  terraform-version:
    description: 'Terraform version to install'
    required: false
    default: 'latest'
  terraform-wrapper:
    description: 'Enable the setup-terraform wrapper (not needed by this action; it adds a [command] line to captured output)'
    required: false
    default: 'false'

  # Azure OIDC credentials (required)
  azure-client-id:
    description: 'Azure Client ID for OIDC'
    required: true
  azure-tenant-id:
    description: 'Azure Tenant ID'
    required: true
  azure-subscription-id:
    description: 'Azure Subscription ID'
    required: true

outputs:
  terraform-version:
    description: 'The installed Terraform version'
    value: ${{ steps.terraform.outputs.terraform-version }}
  azure-cli-version:
    description: 'The installed Azure CLI version'
    value: ${{ steps.verify.outputs.azure-cli-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      id: terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: ${{ inputs.terraform-wrapper }}

    - name: Set Terraform Azure Environment Variables
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        USE_OIDC: 'true'
        USE_AZUREAD: 'true'
        CLIENT_ID: ${{ inputs.azure-client-id }}
        TENANT_ID: ${{ inputs.azure-tenant-id }}
        SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/set-azure-env.js');
          await script({ github, context, core, exec });

    - name: Azure Login (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Verify Setup
      id: verify
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/verify.js');
          await script({ github, context, core, exec });
