name: 'Terraform Validation Summary'
description: 'Create a summary of Terraform validation results for PR'
author: 'wpbastos-com'

branding:
  icon: 'file-text'
  color: 'green'

inputs:
  # Environment identification
  environment:
    description: 'Environment name'
    required: true
  working-directory:
    description: 'Working directory (used to locate plan-output.txt when plan-output-file is not set)'
    required: true
  plan-output-file:
    description: 'Path to the plan output text file (e.g. terraform-run plan-output-file output). Defaults to <working-directory>/plan-output.txt'
    required: false
    default: ''

  # Step outcomes
  fmt-outcome:
    description: 'Format check outcome (success, failure)'
    required: true
  init-outcome:
    description: 'Init outcome (success, failure)'
    required: true
  validate-outcome:
    description: 'Validate outcome (success, failure)'
    required: true
  plan-outcome:
    description: 'Plan outcome (success, failure, skipped)'
    required: true

  # Plan details
  plan-has-changes:
    description: 'Whether the plan has changes (true/false)'
    required: false
    default: 'false'

outputs:
  result:
    description: 'Overall result (success, failure)'
    value: ${{ steps.summary.outputs.result }}
  summary-file:
    description: 'Path to the summary file'
    value: ${{ steps.summary.outputs.summary-file }}

runs:
  using: 'composite'
  steps:
    - name: Create Summary
      id: summary
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        WORKING_DIR: ${{ inputs.working-directory }}
        FMT_OUTCOME: ${{ inputs.fmt-outcome }}
        INIT_OUTCOME: ${{ inputs.init-outcome }}
        VALIDATE_OUTCOME: ${{ inputs.validate-outcome }}
        PLAN_OUTCOME: ${{ inputs.plan-outcome }}
        PLAN_HAS_CHANGES: ${{ inputs.plan-has-changes }}
        PLAN_OUTPUT_FILE: ${{ inputs.plan-output-file }}
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/summary.js');
          await script({ github, context, core, exec });
