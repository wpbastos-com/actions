name: 'Cleanup Workflow Runs'
description: 'Delete old workflow runs to keep the repository clean'
author: 'wpbastos-com'

branding:
  icon: 'trash-2'
  color: 'orange'

inputs:
  retention-days:
    description: 'Delete runs older than X days'
    required: false
    default: '30'
  github-token:
    description: 'GitHub token with actions:write permission'
    required: false
    default: ${{ github.token }}

outputs:
  total-deleted:
    description: 'Total number of workflow runs deleted'
    value: ${{ steps.cleanup.outputs.total-deleted }}
  total-skipped:
    description: 'Total number of workflow runs skipped'
    value: ${{ steps.cleanup.outputs.total-skipped }}
  total-errors:
    description: 'Total number of errors encountered'
    value: ${{ steps.cleanup.outputs.total-errors }}

runs:
  using: 'composite'
  steps:
    - name: Delete old workflow runs
      id: cleanup
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const script = require(require('path').join(process.env.ACTION_PATH, 'scripts', 'cleanup.js'));
          await script({ github, context, core, exec });
